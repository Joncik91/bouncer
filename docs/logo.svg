<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="bouncer">
  <title>bouncer</title>

  <!-- Field.io substrate, same as the rest of the portfolio -->
  <rect width="400" height="400" rx="48" fill="#0E0E0F"/>

  <!-- Subtle horizontal bands marking the velvet-rope tiers -->
  <g stroke="#1B1B20" stroke-width="1">
    <line x1="60"  y1="120" x2="340" y2="120"/>
    <line x1="60"  y1="280" x2="340" y2="280"/>
  </g>

  <!-- Inbound rules: a column of small markers above the rope -->
  <g fill="#4F4F56">
    <rect x="78"  y="68" width="14" height="14" rx="2"/>
    <rect x="106" y="68" width="14" height="14" rx="2"/>
    <rect x="134" y="68" width="14" height="14" rx="2"/>
    <rect x="162" y="68" width="14" height="14" rx="2"/>
    <rect x="190" y="68" width="14" height="14" rx="2"/>
    <rect x="218" y="68" width="14" height="14" rx="2"/>
    <rect x="246" y="68" width="14" height="14" rx="2"/>
    <rect x="274" y="68" width="14" height="14" rx="2"/>
    <rect x="302" y="68" width="14" height="14" rx="2"/>
  </g>

  <!-- The rope: amber filter line, the gate -->
  <line x1="60" y1="120" x2="340" y2="120" stroke="#E8954A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Three amber markers admitted (K=3 cap) -->
  <g>
    <rect x="134" y="142" width="14" height="14" rx="2" fill="#E8954A"/>
    <rect x="190" y="142" width="14" height="14" rx="2" fill="#E8954A"/>
    <rect x="246" y="142" width="14" height="14" rx="2" fill="#E8954A"/>
  </g>

  <!-- Always-on core: a pinned pill below the cap, set apart -->
  <g transform="translate(150 200)">
    <rect width="100" height="44" rx="22" fill="#16161A" stroke="#E8954A" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="5" fill="#E8954A"/>
    <rect x="38" y="14" width="48" height="6" rx="2" fill="#E8954A"/>
    <rect x="38" y="26" width="40" height="5" rx="2" fill="#7A7A82"/>
  </g>

  <!-- Outbound: the per-prompt context window receiving 3 + always-core -->
  <g transform="translate(60 296)">
    <rect width="280" height="44" rx="6" fill="#131318" stroke="#232327" stroke-width="1"/>
    <circle cx="22" cy="22" r="3" fill="#E8954A"/>
    <rect x="44" y="14" width="78" height="6" rx="2" fill="#E8954A"/>
    <rect x="130" y="14" width="38" height="6" rx="2" fill="#E8954A"/>
    <rect x="174" y="14" width="38" height="6" rx="2" fill="#E8954A"/>
    <rect x="218" y="14" width="38" height="6" rx="2" fill="#E8954A"/>
    <rect x="44" y="26" width="216" height="5" rx="2" fill="#4F4F56"/>
  </g>
</svg>
