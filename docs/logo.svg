<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="bouncer">
  <title>bouncer</title>

  <!-- Substrate. Same language as the cc-session-browser sibling. -->
  <rect width="400" height="400" rx="48" fill="#0E0E0F"/>

  <!-- A single amber threshold runs the full width at the optical centre,
       just below the geometric centre so it lands where the eye expects it.
       This is the rope. Everything else is the monogram pivoting around it. -->
  <line x1="56" y1="206" x2="344" y2="206"
        stroke="#E8954A" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

  <!-- Monogram B as a turnstile.
       The vertical stem is the post. The two stacked bowls are gate-arms
       that have rotated *through* the threshold: the upper bowl sits above
       the rope (closed), the lower bowl sits below (admitting). Together
       they make a bold, recognisable B that also reads as a gate.

       Stroke-based construction so the form stays crisp at 32px. -->
  <g fill="none" stroke="#E8954A" stroke-width="32"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Vertical post. Slightly inset from top/bottom so it doesn't kiss
         the rounded panel edge. -->
    <line x1="124" y1="100" x2="124" y2="312"/>

    <!-- Upper bowl: half-circle from the post out to the right and back.
         Sits entirely above the threshold. -->
    <path d="M 124 100
             H 220
             A 53 53 0 0 1 220 206
             H 124"/>

    <!-- Lower bowl: half-circle below the threshold. Slightly larger
         radius than the upper bowl — the optical-correction trick that
         makes a B look balanced. -->
    <path d="M 124 206
             H 232
             A 53 53 0 0 1 232 312
             H 124"/>
  </g>

  <!-- Three admitted rays, sized to suggest K=3 without labelling.
       Short, precisely aligned, sitting just past the lower bowl's
       outer edge. They read as three short tally marks at small sizes
       and as 'three things admitted' at full size. -->
  <g stroke="#E8954A" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="306" y1="240" x2="338" y2="240"/>
    <line x1="306" y1="259" x2="338" y2="259"/>
    <line x1="306" y1="278" x2="338" y2="278"/>
  </g>

  <!-- The always-on core: a single small emerald dot pinned on the post
       at the threshold height. The one rule that escapes gating — and
       the only non-amber colour in the mark, used once, deliberately. -->
  <circle cx="124" cy="206" r="7" fill="#58D070"/>
</svg>
