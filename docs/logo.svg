<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="bouncer">
  <title>bouncer</title>
  <rect width="400" height="400" rx="48" fill="#0E0E0F"/>

  <!-- Two stanchions: round top "ball" + vertical post + base plate -->
  <g fill="#E8954A">
    <!-- Left stanchion -->
    <circle cx="100" cy="160" r="22"/>
    <rect x="92" y="170" width="16" height="150" rx="2"/>
    <rect x="68" y="316" width="64" height="14" rx="2"/>

    <!-- Right stanchion -->
    <circle cx="300" cy="160" r="22"/>
    <rect x="292" y="170" width="16" height="150" rx="2"/>
    <rect x="268" y="316" width="64" height="14" rx="2"/>
  </g>

  <!-- The velvet rope: catenary droop between the two stanchion balls.
       Anchor points just inside each ball, drooping ~70 units below
       the line between them. Heavy stroke for that thick-rope feel. -->
  <path d="M 100 160 Q 200 280 300 160"
        fill="none" stroke="#E8954A" stroke-width="14"
        stroke-linecap="round"/>
</svg>
